[plugin]

name="Live Palette"
description="Centralized named color palette with live propagation. Palette dock (reorder, GIMP .gpl import/export, find uses), a palette picker under every Color property (nodes and resources), generated LivePalette.MY_COLOR constants, and a LivePaletteRuntime autoload that keeps linked colors correct at runtime."
author="Thiago Rocha"
version="1.2.2"
script="plugin.gd"
